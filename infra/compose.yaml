services:
  openwa:
    image: rmyndharis/openwa:0.23.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      ENGINE_TYPE: baileys
      API_MASTER_KEY: ${OPENWA_MASTER_KEY:?Set OPENWA_MASTER_KEY}
      AUTO_START_SESSIONS: "true"
      WEBHOOK_MEDIA_INLINE_MAX_BYTES: "5242880"
      WEBHOOK_MAX_PAYLOAD_BYTES: "8388608"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2785/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
